        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 24px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 0;
        }
        .stats {
            display: flex;
            gap: 20px;
        }
        .stat-box {
            text-align: right;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        canvas {
            width: 100%;
            height: 400px;
            background-color: #0f172a;
            border-radius: 8px;
            display: block;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            gap: 12px;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        .slider-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type=range] {
            width: 100%;
            accent-color: #38bdf8;
        }
    </style>
</head>

<div class="card">
    <div class="header">
        <div>

            <span style="font-size: 0.85rem; color: #94a3b8;"><!-- Add new subtitle here later --></span>

        <div class="stats">
            <div class="stat-box">

            </div>
            <div class="stat-box">

            </div>
        </div>
    </div>

    <canvas id="weightChart"></canvas>

    <div class="controls">
        <button id="playBtn">Pause</button>
        <div class="slider-container">

        <button id="resetBtn">Restart</button>
    </div>
</div>

    const height = canvas.offsetHeight;
    const padding = { top: 30, right: 30, bottom: 40, left: 50 };

    ctx.clearRect(0, 0, width, height);

    // Draw Grid Lines & Y-Axis Labels
    ctx.strokeStyle = '#334155';
    ctx.fillStyle = '#64748b';
    ctx.font = '12px sans-serif';
    ctx.lineWidth = 1;

    for (let w = minWeight; w <= maxWeight; w += 10) {
        const y = height - padding.bottom - ((w - minWeight) / (maxWeight - minWeight)) * (height - padding.top - padding.bottom);
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        ctx.fillText(w + ' lbs', 10, y + 4);
    }

    if (currentIndex <= 0) return;

    // Plot Line
    const plotWidth = width - padding.left - padding.right;
    const plotHeight = height - padding.top - padding.bottom;

    ctx.beginPath();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;

    for (let i = 0; i <= currentIndex; i++) {
        const x = padding.left + (i / (rawData.length - 1)) * plotWidth;
        const y = height - padding.bottom - ((rawData[i][1] - minWeight) / (maxWeight - minWeight)) * plotHeight;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }
    ctx.stroke();

    // Fill Gradient under line
    const lastX = padding.left + (currentIndex / (rawData.length - 1)) * plotWidth;
    const lastY = height - padding.bottom - ((rawData[currentIndex][1] - minWeight) / (maxWeight - minWeight)) * plotHeight;
    const firstX = padding.left;

    ctx.lineTo(lastX, height - padding.bottom);
    ctx.lineTo(firstX, height - padding.bottom);
    ctx.closePath();
    const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
    gradient.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
    gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');
    ctx.fillStyle = gradient;
    ctx.fill();

    // Highlight Current Point
    ctx.beginPath();
    ctx.arc(lastX, lastY, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Update Header Text
    currentDateEl.innerText = rawData[currentIndex][0];
    currentWeightEl.innerText = rawData[currentIndex][1].toFixed(1) + ' lbs';
    progressSlider.value = (currentIndex / (rawData.length - 1)) * 100;
}

function tick() {
    if (currentIndex < rawData.length - 1) {
        currentIndex++;
        draw();
    } else {
        pauseAnimation();
    }
}

function startAnimation() {
    if (currentIndex >= rawData.length - 1) currentIndex = 0;
    isPlaying = true;
    playBtn.innerText = 'Pause';
    timer = setInterval(tick, animationSpeed);
}

function pauseAnimation() {
    isPlaying = false;
    playBtn.innerText = 'Play';
    if (timer) clearInterval(timer);
}

playBtn.addEventListener('click', () => {
    if (isPlaying) {
        pauseAnimation();
    } else {
        startAnimation();
    }
});

resetBtn.addEventListener('click', () => {
    pauseAnimation();
    currentIndex = 0;
    draw();
});

progressSlider.addEventListener('input', (e) => {
    pauseAnimation();
    const val = parseFloat(e.target.value);
    currentIndex = Math.round((val / 100) * (rawData.length - 1));
    draw();
});

// Initial Setup
resizeCanvas();
startAnimation();
</script>
</body>
</html>
